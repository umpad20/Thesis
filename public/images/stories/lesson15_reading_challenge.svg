<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="960" height="540" fill="url(#bgGrad15)"/>
  
  <!-- Classroom Wall details -->
  <rect x="0" y="380" width="960" height="160" fill="url(#floorGrad)"/>
  <rect x="120" y="40" width="720" height="260" rx="16" fill="#064E3B" stroke="#047857" stroke-width="8" filter="url(#cardGlow)"/>
  <text x="480" y="100" fill="#6EE7B7" font-size="28" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="2">🌟 30-DAY READING CHALLENGE 🌟</text>
  <text x="480" y="150" fill="#A7F3D0" font-size="20" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">"Read 15 Minutes Every Day — Build Confidence!"</text>
  
  <!-- Star stickers on board -->
  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="24" fill="#FBBF24"/>
    <text x="0" y="7" font-size="22" text-anchor="middle">⭐</text>
  </g>
  <g transform="translate(260, 200)">
    <circle cx="0" cy="0" r="24" fill="#FBBF24"/>
    <text x="0" y="7" font-size="22" text-anchor="middle">⭐</text>
  </g>
  <g transform="translate(340, 200)">
    <circle cx="0" cy="0" r="24" fill="#FBBF24"/>
    <text x="0" y="7" font-size="22" text-anchor="middle">⭐</text>
  </g>
  <g transform="translate(700, 200)">
    <circle cx="0" cy="0" r="24" fill="#34D399"/>
    <text x="0" y="7" font-size="22" text-anchor="middle">🏆</text>
  </g>

  <!-- Bookshelf on side -->
  <rect x="30" y="120" width="70" height="260" rx="8" fill="#B45309"/>
  <rect x="35" y="150" width="60" height="12" fill="#FEF3C7"/>
  <rect x="35" y="210" width="60" height="12" fill="#FEF3C7"/>
  <rect x="35" y="270" width="60" height="12" fill="#FEF3C7"/>
  
  <!-- Clara standing proudly in center -->
  <g transform="translate(480, 420)" filter="url(#cardGlow)">
    <!-- Shadow -->
    <ellipse cx="0" cy="40" rx="90" ry="16" fill="#000000" opacity="0.25"/>
    
    <!-- Body / Dress -->
    <path d="M -35 10 L 35 10 L 50 40 L -50 40 Z" fill="#EC4899"/>
    <!-- Head -->
    <circle cx="0" cy="-60" r="45" fill="#FCD34D"/>
    <!-- Hair -->
    <path d="M -48 -60 C -48 -105 48 -105 48 -60 C 48 -30 40 -10 35 15 C 30 15 25 -30 25 -50 C -25 -50 -25 15 -35 15 C -40 -10 -48 -30 -48 -60 Z" fill="#78350F"/>
    <!-- Cute Face -->
    <ellipse cx="-16" cy="-60" rx="5" ry="7" fill="#1E293B"/>
    <ellipse cx="16" cy="-60" rx="5" ry="7" fill="#1E293B"/>
    <circle cx="-14" cy="-63" r="2.5" fill="#FFFFFF"/>
    <circle cx="18" cy="-63" r="2.5" fill="#FFFFFF"/>
    <circle cx="-28" cy="-48" r="8" fill="#F43F5E" opacity="0.35"/>
    <circle cx="28" cy="-48" r="8" fill="#F43F5E" opacity="0.35"/>
    <path d="M -12 -42 Q 0 -30 12 -42" stroke="#B91C1C" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Open Book in hands -->
    <g transform="translate(0, 0)">
      <!-- Left Page -->
      <path d="M 0 -10 L -60 -25 L -55 25 L 0 35 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Right Page -->
      <path d="M 0 -10 L 60 -25 L 55 25 L 0 35 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="-50" y1="-15" x2="-10" y2="-7" stroke="#94A3B8" stroke-width="2"/>
      <line x1="-50" y1="-5" x2="-10" y2="3" stroke="#94A3B8" stroke-width="2"/>
      <line x1="-50" y1="5" x2="-10" y2="13" stroke="#94A3B8" stroke-width="2"/>
      <line x1="10" y1="-7" x2="50" y2="-15" stroke="#94A3B8" stroke-width="2"/>
      <line x1="10" y1="3" x2="50" y2="-5" stroke="#94A3B8" stroke-width="2"/>
      <line x1="10" y1="13" x2="50" y2="5" stroke="#94A3B8" stroke-width="2"/>
    </g>
    <!-- Hands -->
    <circle cx="-62" cy="0" r="10" fill="#FCD34D"/>
    <circle cx="62" cy="0" r="10" fill="#FCD34D"/>
  </g>

  <!-- Cheerful classmates in desks listening -->
  <g transform="translate(220, 460)">
    <rect x="-40" y="-10" width="80" height="30" rx="6" fill="#3B82F6"/>
    <circle cx="0" cy="-40" r="22" fill="#FDE68A"/>
    <path d="M -20 -40 C -20 -65 20 -65 20 -40 Z" fill="#1E293B"/>
    <text x="0" y="-70" font-size="20" text-anchor="middle">👏</text>
  </g>
  <g transform="translate(740, 460)">
    <rect x="-40" y="-10" width="80" height="30" rx="6" fill="#10B981"/>
    <circle cx="0" cy="-40" r="22" fill="#FDE68A"/>
    <path d="M -20 -40 C -20 -65 20 -65 20 -40 Z" fill="#92400E"/>
    <text x="0" y="-70" font-size="20" text-anchor="middle">✨</text>
  </g>
</svg>