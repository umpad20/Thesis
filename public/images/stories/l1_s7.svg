<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
  </defs>

  <!-- Sky & Sun -->
  <rect width="800" height="380" fill="url(#skyGrad)" />
  <circle cx="700" cy="90" r="55" fill="#fef08a" opacity="0.8" />
  <circle cx="700" cy="90" r="40" fill="#facc15" />

  <!-- Distant School & Trees -->
  <rect x="50" y="220" width="220" height="120" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="3" />
  <polygon points="40,220 160,150 280,220" fill="#f87171" stroke="#dc2626" stroke-width="3" />
  <!-- Tree -->
  <rect x="680" y="240" width="30" height="100" fill="#92400e" rx="4" />
  <circle cx="695" cy="210" r="75" fill="#22c55e" opacity="0.9" />

  <!-- Green Grass Playground -->
  <path d="M0,340 Q400,320 800,340 L800,600 L0,600 Z" fill="url(#grassGrad)" />

  <!-- Playground Slide -->
  <g transform="translate(560, 240)">
    <rect x="0" y="40" width="12" height="100" fill="#64748b" />
    <rect x="50" y="40" width="12" height="100" fill="#64748b" />
    <path d="M0,40 Q30,90 90,140" stroke="#3b82f6" stroke-width="18" fill="none" stroke-linecap="round" />
  </g>

  <!-- ── CHARACTER 1: Anna (Yellow Shirt, Pigtails) ── -->
  <g transform="translate(290, 290)">
    <!-- Body / Shirt -->
    <rect x="25" y="80" width="50" height="55" rx="10" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
    <text x="50" y="112" text-anchor="middle" font-size="18" fill="#1e3a8a">⭐</text>
    <!-- Skirt -->
    <path d="M20,135 L80,135 L90,175 L10,175 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="3" />
    <!-- Legs -->
    <rect x="28" y="175" width="12" height="35" fill="#fed7aa" rx="4" />
    <rect x="60" y="175" width="12" height="35" fill="#fed7aa" rx="4" />
    <!-- Red Shoes -->
    <ellipse cx="34" cy="215" rx="14" ry="7" fill="#ef4444" />
    <ellipse cx="66" cy="215" rx="14" ry="7" fill="#ef4444" />
    <!-- Head & Pigtails -->
    <circle cx="10" cy="40" r="16" fill="#78350f" />
    <circle cx="90" cy="40" r="16" fill="#78350f" />
    <circle cx="10" cy="35" r="8" fill="#f43f5e" />
    <circle cx="90" cy="35" r="8" fill="#f43f5e" />
    <circle cx="50" cy="45" r="32" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
    <!-- Hair Top -->
    <path d="M18,40 Q50,15 82,40 Q50,30 18,40 Z" fill="#78350f" />
    <!-- Face -->
    <circle cx="38" cy="45" r="4" fill="#0f172a" />
    <circle cx="62" cy="45" r="4" fill="#0f172a" />
    <path d="M42,56 Q50,66 58,56" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Waving Arm -->
    <path d="M75,90 Q110,60 115,40" stroke="#fed7aa" stroke-width="12" fill="none" stroke-linecap="round" />
  </g>

  <!-- ── CHARACTER 2: Mia (Peach Shirt, Blue Jeans, Rainbow Bag) ── -->
  <g transform="translate(430, 290)">
    <!-- Rainbow Backpack on Back -->
    <rect x="70" y="85" width="22" height="45" rx="8" fill="#f43f5e" />
    <rect x="74" y="92" width="18" height="10" fill="#facc15" />
    <rect x="74" y="104" width="18" height="10" fill="#38bdf8" />
    <!-- Body / Peach Shirt -->
    <rect x="25" y="80" width="50" height="55" rx="10" fill="#fb923c" stroke="#ea580c" stroke-width="3" />
    <!-- Blue Jeans -->
    <rect x="25" y="135" width="22" height="70" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3" rx="4" />
    <rect x="53" y="135" width="22" height="70" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3" rx="4" />
    <!-- Brown Shoes -->
    <ellipse cx="36" cy="210" rx="14" ry="7" fill="#78350f" />
    <ellipse cx="64" cy="210" rx="14" ry="7" fill="#78350f" />
    <!-- Head & Brown Hair -->
    <circle cx="50" cy="45" r="32" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
    <path d="M16,42 Q50,10 84,42 Q86,75 75,80 Q50,45 25,80 Z" fill="#78350f" />
    <!-- Face: Happy Smile & Blush -->
    <circle cx="38" cy="45" r="4" fill="#0f172a" />
    <circle cx="62" cy="45" r="4" fill="#0f172a" />
    <circle cx="30" cy="52" r="5" fill="#fca5a5" opacity="0.6" />
    <circle cx="70" cy="52" r="5" fill="#fca5a5" opacity="0.6" />
    <path d="M42,56 Q50,66 58,56" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Arm Reaching to Anna -->
    <path d="M25,90 Q-5,85 -10,75" stroke="#fed7aa" stroke-width="12" fill="none" stroke-linecap="round" />
  </g>

  <!-- Ground Flowers -->
  <g transform="translate(180, 520)">
    <circle cx="0" cy="0" r="6" fill="#f43f5e" /><circle cx="0" cy="0" r="2" fill="#fef08a" />
    <circle cx="160" cy="-20" r="7" fill="#a855f7" /><circle cx="160" cy="-20" r="2" fill="#fef08a" />
    <circle cx="380" cy="10" r="6" fill="#3b82f6" /><circle cx="380" cy="10" r="2" fill="#fef08a" />
  </g>
</svg>