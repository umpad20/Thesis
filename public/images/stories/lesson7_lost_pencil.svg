<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_lesson7_lost_pencil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="280" rx="16" fill="url(#grad_lesson7_lost_pencil)" />
  
  <!-- Story Visual Elements -->
  
      <!-- Classroom Desks -->
      <rect x="60" y="170" width="160" height="60" rx="8" fill="#D97706" />
      <rect x="280" y="170" width="160" height="60" rx="8" fill="#D97706" />
      <!-- Joshua holding out the Rocket Pencil -->
      <circle cx="170" cy="115" r="20" fill="#FCD34D" />
      <rect x="150" y="135" width="40" height="45" rx="8" fill="#2563EB" />
      <!-- Shiny Blue Rocket Pencil -->
      <g transform="translate(225, 125) rotate(-30)">
        <rect x="0" y="0" width="55" height="12" rx="3" fill="#3B82F6" />
        <polygon points="55,0 68,6 55,12" fill="#F59E0B" />
        <text x="8" y="10" font-size="9" fill="#FFFFFF">🚀</text>
      </g>
      <!-- Daniel joyfully receiving it -->
      <circle cx="330" cy="115" r="20" fill="#FCD34D" />
      <rect x="310" y="135" width="40" height="45" rx="8" fill="#10B981" />
      <!-- Joyful Heart & Sparkles -->
      <text x="240" y="95" font-size="26">💖</text>
      <text x="265" y="80" font-size="18">✨</text>
    

  <!-- Title Watermark Badge -->
  <g transform="translate(16, 16)">
    <rect width="180" height="26" rx="8" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="10" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#D97706">
      🥉 Bronze Medal
    </text>
  </g>
</svg>