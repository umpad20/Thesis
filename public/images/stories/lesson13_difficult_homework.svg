<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_lesson13_difficult_homework" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="280" rx="16" fill="url(#grad_lesson13_difficult_homework)" />
  
  <!-- Story Visual Elements -->
  
      <!-- Desk with open reading book -->
      <rect x="80" y="140" width="340" height="20" rx="4" fill="#92400E" />
      <!-- Ava examining story clues -->
      <circle cx="180" cy="90" r="18" fill="#FCD34D" />
      <rect x="165" y="108" width="30" height="42" rx="6" fill="#F43F5E" />
      <!-- Open Book with Underlined Clues -->
      <rect x="220" y="115" width="70" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <line x1="225" y1="125" x2="255" y2="125" stroke="#EAB308" stroke-width="3" stroke-linecap="round" />
      <line x1="225" y1="135" x2="275" y2="135" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
      <!-- Brother guiding with pointer -->
      <circle cx="330" cy="80" r="20" fill="#FCD34D" />
      <rect x="310" y="100" width="40" height="50" rx="8" fill="#2563EB" />
      <!-- "Aha! Lightbulb Discovery" -->
      <circle cx="180" cy="40" r="14" fill="#FEF08A" stroke="#F59E0B" stroke-width="2" />
      <text x="173" y="46" font-size="16">💡</text>
    

  <!-- Title Watermark Badge -->
  <g transform="translate(16, 16)">
    <rect width="180" height="26" rx="8" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="10" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#EAB308">
      🥇 Gold Medal
    </text>
  </g>
</svg>