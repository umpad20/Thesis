<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_lesson5_forgotten_homework" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="280" rx="16" fill="url(#grad_lesson5_forgotten_homework)" />
  
  <!-- Story Visual Elements -->
  
      <!-- Study Desk -->
      <rect x="80" y="160" width="340" height="20" rx="4" fill="#78350F" />
      <rect x="110" y="180" width="18" height="70" fill="#451A03" />
      <rect x="370" y="180" width="18" height="70" fill="#451A03" />
      <!-- Liam Doing Homework with Desk Lamp -->
      <circle cx="230" cy="110" r="22" fill="#FCD34D" />
      <rect x="210" y="132" width="40" height="48" rx="8" fill="#3B82F6" />
      <!-- Open Homework Book and Pencil -->
      <rect x="180" y="150" width="50" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <line x1="235" y1="145" x2="250" y2="160" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
      <!-- Desk Lamp Shining -->
      <path d="M 120,160 L 140,90 L 160,105" stroke="#64748B" stroke-width="6" fill="none" />
      <polygon points="150,90 190,75 180,120" fill="#FEF08A" opacity="0.6" />
      <!-- Completed Star Stamp -->
      <text x="290" y="130" font-size="30">⭐ A+</text>
      <!-- Toys parked neatly on shelf (responsibility) -->
      <rect x="300" y="80" width="100" height="12" fill="#92400E" />
      <text x="315" y="75" font-size="20">🚗 🧸</text>
    

  <!-- Title Watermark Badge -->
  <g transform="translate(16, 16)">
    <rect width="180" height="26" rx="8" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="10" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#8B5CF6">
      🎗️ Ribbon Badge
    </text>
  </g>
</svg>