<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_lesson9_extra_change" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="280" rx="16" fill="url(#grad_lesson9_extra_change)" />
  
  <!-- Story Visual Elements -->
  
      <!-- Sari-sari Store Counter -->
      <rect x="60" y="140" width="380" height="30" rx="6" fill="#78350F" />
      <rect x="60" y="170" width="380" height="70" fill="#B45309" />
      <!-- Jars of Treats & Fresh Bread -->
      <rect x="90" y="90" width="35" height="50" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />
      <text x="98" y="125" font-size="18">🍞</text>
      <!-- Shopkeeper smiling behind counter -->
      <circle cx="180" cy="90" r="20" fill="#FCD34D" />
      <rect x="160" y="110" width="40" height="30" rx="6" fill="#EC4899" />
      <!-- Marco returning the 10 peso coins -->
      <circle cx="330" cy="100" r="20" fill="#FCD34D" />
      <rect x="310" y="120" width="40" height="50" rx="8" fill="#2563EB" />
      <!-- Coins on counter -->
      <circle cx="250" cy="135" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
      <circle cx="262" cy="135" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
      <text x="250" y="90" font-size="24">🪙 👍</text>
    

  <!-- Title Watermark Badge -->
  <g transform="translate(16, 16)">
    <rect width="180" height="26" rx="8" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="10" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#D97706">
      🥉 Bronze Medal
    </text>
  </g>
</svg>