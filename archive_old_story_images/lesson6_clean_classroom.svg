<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_lesson6_clean_classroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="280" rx="16" fill="url(#grad_lesson6_clean_classroom)" />
  
  <!-- Story Visual Elements -->
  
      <!-- Classroom Board -->
      <rect x="100" y="40" width="300" height="100" rx="8" fill="#065F46" stroke="#047857" stroke-width="4" />
      <text x="140" y="80" fill="#A7F3D0" font-size="16" font-family="sans-serif" font-weight="bold">Grade 3 Clean Classroom</text>
      <text x="170" y="105" fill="#FFFFFF" font-size="14" font-family="sans-serif">Together We Care! 🌟</text>
      <!-- Maria picking up papers into recycling bin -->
      <circle cx="150" cy="170" r="16" fill="#FCD34D" />
      <rect x="138" y="186" width="24" height="36" rx="6" fill="#EC4899" />
      <rect x="90" y="190" width="32" height="45" rx="6" fill="#10B981" /> <!-- Green Bin -->
      <text x="96" y="220" font-size="18">♻️</text>
      <!-- Paolo arranging chairs -->
      <circle cx="340" cy="165" r="16" fill="#FCD34D" />
      <rect x="328" y="181" width="24" height="36" rx="6" fill="#3B82F6" />
      <rect x="290" y="185" width="25" height="40" rx="4" fill="#F59E0B" /> <!-- Chair -->
      <!-- Sparkle effects -->
      <text x="230" y="190" font-size="22">✨</text>
      <text x="260" y="170" font-size="20">🧹</text>
    

  <!-- Title Watermark Badge -->
  <g transform="translate(16, 16)">
    <rect width="180" height="26" rx="8" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="10" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#10B981">
      🎗️ Ribbon Badge
    </text>
  </g>
</svg>