<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_lesson2_sharing_lunch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="280" rx="16" fill="url(#grad_lesson2_sharing_lunch)" />
  
  <!-- Story Visual Elements -->
  
      <!-- Recess Table Bench -->
      <rect x="50" y="180" width="400" height="16" rx="4" fill="#B45309" />
      <rect x="90" y="196" width="16" height="60" fill="#78350F" />
      <rect x="390" y="196" width="16" height="60" fill="#78350F" />
      <!-- Ben (Boy Left) -->
      <circle cx="160" cy="120" r="22" fill="#FCD34D" />
      <path d="M 140,110 Q 160,95 180,110" stroke="#78350F" stroke-width="6" fill="none" />
      <rect x="140" y="142" width="40" height="48" rx="10" fill="#10B981" />
      <!-- Leo (Boy Right, Grateful Smile) -->
      <circle cx="340" cy="120" r="22" fill="#FCD34D" />
      <path d="M 320,110 Q 340,95 360,110" stroke="#451A03" stroke-width="6" fill="none" />
      <rect x="320" y="142" width="40" height="48" rx="10" fill="#6366F1" />
      <!-- Divided Lunchbox on Table -->
      <rect x="220" y="160" width="60" height="24" rx="6" fill="#EF4444" />
      <rect x="223" y="163" width="26" height="18" rx="3" fill="#FFFFFF" /> <!-- Rice -->
      <rect x="251" y="163" width="26" height="18" rx="3" fill="#F59E0B" /> <!-- Chicken & Mango -->
      <!-- Shared Portion -->
      <rect x="290" y="165" width="24" height="18" rx="4" fill="#3B82F6" />
      <!-- Sparkle & Heart -->
      <text x="245" y="140" font-size="24">🍱</text>
      <text x="240" y="115" font-size="20">💛</text>
    

  <!-- Title Watermark Badge -->
  <g transform="translate(16, 16)">
    <rect width="180" height="26" rx="8" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="10" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">
      ⭐ Star Badge
    </text>
  </g>
</svg>