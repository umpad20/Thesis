<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_lesson8_broken_pot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="280" rx="16" fill="url(#grad_lesson8_broken_pot)" />
  
  <!-- Story Visual Elements -->
  
      <!-- Garden plants and flowers -->
      <path d="M 0,220 Q 250,190 500,220 L 500,280 L 0,280 Z" fill="#86EFAC" />
      <!-- Soccer Ball -->
      <circle cx="100" cy="200" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
      <polygon points="100,190 108,197 105,207 95,207 92,197" fill="#000000" />
      <!-- Broken terracotta pot pieces -->
      <polygon points="170,220 190,190 205,220" fill="#C2410C" />
      <polygon points="205,220 220,185 235,220" fill="#EA580C" />
      <circle cx="210" cy="180" r="10" fill="#EC4899" /> <!-- Flower -->
      <!-- Nina admitting mistake to Mother -->
      <!-- Nina -->
      <circle cx="290" cy="140" r="16" fill="#FCD34D" />
      <rect x="278" y="156" width="24" height="38" rx="6" fill="#F43F5E" />
      <!-- Mother comforting Nina with understanding smile -->
      <circle cx="365" cy="120" r="20" fill="#FCD34D" />
      <rect x="345" y="140" width="40" height="55" rx="10" fill="#8B5CF6" />
      <path d="M 345,155 Q 315,160 300,165" stroke="#FCD34D" stroke-width="5" fill="none" stroke-linecap="round" />
      <!-- Honesty Star -->
      <text x="320" y="95" font-size="24">🌟</text>
    

  <!-- Title Watermark Badge -->
  <g transform="translate(16, 16)">
    <rect width="180" height="26" rx="8" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="10" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#D97706">
      🥉 Bronze Medal
    </text>
  </g>
</svg>