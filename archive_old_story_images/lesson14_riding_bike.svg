<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_lesson14_riding_bike" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="280" rx="16" fill="url(#grad_lesson14_riding_bike)" />
  
  <!-- Story Visual Elements -->
  
      <!-- Park Path -->
      <path d="M 0,220 Q 250,180 500,200 L 500,280 L 0,280 Z" fill="#86EFAC" />
      <path d="M 0,250 Q 250,210 500,230 L 500,280 L 0,280 Z" fill="#E2E8F0" />
      <!-- Daniel Riding Bike Solo -->
      <!-- Bike Wheels -->
      <circle cx="280" cy="220" r="24" fill="none" stroke="#1E293B" stroke-width="5" />
      <circle cx="370" cy="220" r="24" fill="none" stroke="#1E293B" stroke-width="5" />
      <!-- Bike Frame -->
      <polygon points="280,220 325,220 350,175 310,175" fill="none" stroke="#EF4444" stroke-width="6" stroke-linejoin="round" />
      <line x1="325" y1="220" x2="310" y2="160" stroke="#EF4444" stroke-width="6" />
      <line x1="370" y1="220" x2="350" y2="160" stroke="#EF4444" stroke-width="6" />
      <!-- Daniel on Bike -->
      <circle cx="320" cy="115" r="18" fill="#FCD34D" />
      <circle cx="320" cy="105" r="20" fill="none" stroke="#3B82F6" stroke-width="5" /> <!-- Helmet -->
      <rect x="305" y="133" width="30" height="38" rx="6" fill="#10B981" />
      <!-- Father Cheering Behind -->
      <circle cx="120" cy="130" r="20" fill="#FCD34D" />
      <rect x="100" y="150" width="40" height="55" rx="8" fill="#6366F1" />
      <!-- Father Arms Raised Celebrating -->
      <path d="M 100,165 L 75,135" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" />
      <path d="M 140,165 L 165,135" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" />
      <!-- Joyful Stars -->
      <text x="360" y="110" font-size="28">🚲 🎉</text>
      <text x="135" y="110" font-size="22">👏</text>
    

  <!-- Title Watermark Badge -->
  <g transform="translate(16, 16)">
    <rect width="180" height="26" rx="8" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="10" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#EAB308">
      🥇 Gold Medal
    </text>
  </g>
</svg>